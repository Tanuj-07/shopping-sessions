[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "reference"
path = "src/bin/reference.rs"

[[bin]]
name = "fast"
path = "src/bin/fast.rs"

[dependencies]
rustc-hash = "2"
rayon = "1"
memchr = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Profiling build: `cargo build --release --features profile` reads the SS_EXP / SS_SLAB / SS_PF
# measurement switches. The normal (submitted) build compiles them out.
profile = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

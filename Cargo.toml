[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "reference"
path = "src/bin/reference.rs"

[[bin]]
name = "fast"
path = "src/bin/fast.rs"

[dependencies]
rustc-hash = "2"
rayon = "1"
memmap2 = "0.9"
memchr = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
